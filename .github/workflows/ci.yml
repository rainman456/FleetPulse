name: ci

# Static checks only: nothing in this workflow has been executed as part of
# the scaffold, and no job needs cloud credentials. go.sum must be committed
# (see .gitignore and docs/verify.md) or the go job stops at `go mod verify`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go build / vet / test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Verify dependency lockfile
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  docker:
    name: docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: false

      - name: Build simulator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.simulator
          push: false

      - name: Build downstream image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.downstream
          push: false

  terraform:
    name: terraform fmt / validate / tflint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform/aws
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive

      # -backend=false: no state, no cloud access, no credentials.
      - name: Init (plugins only)
        run: terraform init -backend=false

      - name: Validate (real-AWS defaults)
        run: terraform validate

      - name: Validate (LocalStack mode)
        run: terraform validate
        env:
          TF_VAR_use_localstack: "true"

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: TFLint init
        run: tflint --init

      - name: TFLint
        run: tflint --format compact
